name: CI-Prod

on:
  push:
    branches:
      - feat/ci-cd
      - dev
      - main
  pull_request:
    branches:
      - main

jobs:
  # 1. Run linting
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: booky-blinders/package-lock.json

      - name: Install dependencies
        working-directory: booky-blinders
        run: |
          npm config set registry https://registry.npmjs.org/
          npm install --no-package-lock --no-audit --no-fund

      - name: Run linting
        working-directory: booky-blinders
        run: npm run lint

  # 2. Run tests
  test:
    runs-on: ubuntu-latest
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: booky-blinders/package-lock.json

      - name: Install dependencies
        working-directory: booky-blinders
        run: |
          npm config set registry https://registry.npmjs.org/
          npm install --no-package-lock --no-audit --no-fund

      - name: Run tests
        working-directory: booky-blinders
        run: npm run test

      - name: Generate coverage report
        working-directory: booky-blinders
        run: npm run coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./booky-blinders/coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  # 3. Synchroniser le schéma Drizzle avec Supabase
  database-migration:
    runs-on: ubuntu-latest
    needs: [lint, test] # Ne tourne que si le code est propre et les tests passent
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: booky-blinders/package-lock.json

      - name: Install dependencies
        working-directory: booky-blinders
        run: |
          npm config set registry https://registry.npmjs.org/
          npm install --no-package-lock --no-audit --no-fund

      - name: Push schema to Supabase
        working-directory: booky-blinders
        # NOTE : En production avancée, on préfère "npm run db:migrate", mais "db:push" 
        # appliquera la structure de ton code à Supabase directement.
        run: npm run db:push

  # 4. Build the Next.js application
  build:
    runs-on: ubuntu-latest
    needs: [database-migration] # Le build attend que la BDD soit prête
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: booky-blinders/package-lock.json

      - name: Install dependencies
        working-directory: booky-blinders
        run: |
          npm config set registry https://registry.npmjs.org/
          npm install --no-package-lock --no-audit --no-fund

      - name: Build application
        working-directory: booky-blinders
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-prod
          path: booky-blinders/.next
          retention-days: 1