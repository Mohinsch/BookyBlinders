export function Logo({ className = "", width = 200, height = 200 }: { className?: string; width?: number; height?:
number }) {
return (
<svg width={width} height={height} viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg"
  className={className}>
  {/* Forme principale - courbe fluide */}
  <path
    d="M 60 160 Q 65 140 70 120 Q 75 100 82 85 Q 90 65 100 50 Q 108 38 118 28 L 140 10 Q 110 40 100 60 Q 92 75 87 90 Q 82 105 78 122 Q 75 135 73 148 Q 71 158 68 168 Z"
    fill="url(#goldGradient)" />

  {/* Cercle supérieur */}
  <circle cx="85" cy="60" r="8" fill="url(#goldGradient)" />

  {/* Définition du dégradé doré */}
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#E6B877" />
      <stop offset="50%" stopColor="#D4A361" />
      <stop offset="100%" stopColor="#C89850" />
    </linearGradient>
  </defs>
</svg>
);
}