<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @font-face {
        font-family: 'ETCO Brookshire';
        src: url('fonts/ETCOBrookshire.woff2') format('woff2'),
             url('fonts/ETCOBrookshire.woff') format('woff'),
             url('fonts/ETCOBrookshire.otf') format('opentype'),
             url('fonts/ETCOBrookshire.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
      }
    </style>

    <!-- Aged brass radial -->
    <radialGradient id="hs-brassMetal" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f0d78c"/>
      <stop offset="18%" stop-color="#d4b867"/>
      <stop offset="40%" stop-color="#c5a049"/>
      <stop offset="62%" stop-color="#a8883a"/>
      <stop offset="85%" stop-color="#7d6425"/>
      <stop offset="100%" stop-color="#5c4a1a"/>
    </radialGradient>

    <!-- Tarnished dark brass -->
    <radialGradient id="hs-darkBrass" cx="55%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#8a7030"/>
      <stop offset="50%" stop-color="#5c4a1a"/>
      <stop offset="100%" stop-color="#3a2f10"/>
    </radialGradient>

    <!-- Rim bevel highlight -->
    <linearGradient id="hs-rimHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6a3" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#d4b564" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#a08030" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5c4a1a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Letter gradient top-lit -->
    <linearGradient id="hs-letterGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#f7e8a0"/>
      <stop offset="25%" stop-color="#d4b564"/>
      <stop offset="55%" stop-color="#b89940"/>
      <stop offset="80%" stop-color="#8a6e2f"/>
      <stop offset="100%" stop-color="#5c4a1a"/>
    </linearGradient>

    <!-- Letter face polished -->
    <linearGradient id="hs-letterFace" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#eed88a"/>
      <stop offset="40%" stop-color="#c9a64e"/>
      <stop offset="70%" stop-color="#a08030"/>
      <stop offset="100%" stop-color="#7a6020"/>
    </linearGradient>

    <!-- Shimmer sweep -->
    <linearGradient id="hs-shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8dc" stop-opacity="0"/>
      <stop offset="40%" stop-color="#fff8dc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff8dc" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#fff8dc" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff8dc" stop-opacity="0"/>
    </linearGradient>

    <!-- Rim edge highlight -->
    <linearGradient id="hs-edgeLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e6a3" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#c5a049" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5c4a1a" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Inner field dark -->
    <radialGradient id="hs-innerField" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2a2418"/>
      <stop offset="60%" stop-color="#1a1710"/>
      <stop offset="100%" stop-color="#0f0d08"/>
    </radialGradient>

    <!-- Heavy emboss for outer ring -->
    <filter id="hs-ringEmboss" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur1"/>
      <feSpecularLighting in="blur1" surfaceScale="6" specularConstant="1.2" specularExponent="25" result="spec1">
        <feDistantLight azimuth="225" elevation="45"/>
      </feSpecularLighting>
      <feComposite in="spec1" in2="SourceAlpha" operator="in" result="specClip"/>
      <feComposite in="SourceGraphic" in2="specClip" operator="arithmetic" k1="0" k2="1" k3="0.6" k4="0"/>
    </filter>

    <!-- Deep emboss for BB letters -->
    <filter id="hs-letterEmboss" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="lBlur"/>
      <feSpecularLighting in="lBlur" surfaceScale="8" specularConstant="1.5" specularExponent="35" result="lSpec">
        <feDistantLight azimuth="215" elevation="50"/>
      </feSpecularLighting>
      <feComposite in="lSpec" in2="SourceAlpha" operator="in" result="lSpecClip"/>
      <feComposite in="SourceGraphic" in2="lSpecClip" operator="arithmetic" k1="0" k2="1" k3="0.7" k4="0"/>
    </filter>

    <!-- Inner shadow -->
    <filter id="hs-innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="iBlur"/>
      <feOffset dx="3" dy="4" result="iOff"/>
      <feComposite in="iOff" in2="SourceAlpha" operator="arithmetic" k1="0" k2="1" k3="-1" k4="0" result="iShadow"/>
      <feFlood flood-color="#000000" flood-opacity="0.55" result="iColor"/>
      <feComposite in="iColor" in2="iShadow" operator="in" result="iFinal"/>
      <feComposite in="SourceGraphic" in2="iFinal" operator="over"/>
    </filter>

    <!-- Drop shadow -->
    <filter id="hs-dropShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="dBlur"/>
      <feOffset dx="0" dy="8" result="dOff"/>
      <feFlood flood-color="#000000" flood-opacity="0.6" result="dColor"/>
      <feComposite in="dColor" in2="dOff" operator="in" result="dSh"/>
      <feMerge>
        <feMergeNode in="dSh"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Noise texture -->
    <filter id="hs-noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="noisyResult"/>
      <feComponentTransfer in="noisyResult">
        <feFuncA type="linear" slope="1"/>
      </feComponentTransfer>
    </filter>

    <!-- Grain overlay -->
    <filter id="hs-grain">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="3" result="grain"/>
      <feColorMatrix type="saturate" values="0" in="grain" result="gGray"/>
      <feBlend in="SourceGraphic" in2="gGray" mode="overlay"/>
    </filter>

    <!-- Shimmer clip -->
    <clipPath id="hs-sealClip">
      <circle cx="300" cy="300" r="248"/>
    </clipPath>

    <!-- Circular text paths -->
    <path id="hs-topTextPath" d="M 105,300 A 195,195 0 0,1 495,300" fill="none"/>
    <path id="hs-bottomTextPath" d="M 495,300 A 195,195 0 0,1 105,300" fill="none"/>
  </defs>

  <!-- DROP SHADOW LAYER -->
  <g filter="url(#hs-dropShadow)">
    <!-- OUTER BEZEL RING -->
    <circle cx="300" cy="300" r="248" fill="url(#hs-brassMetal)"/>
    <circle cx="300" cy="300" r="248" fill="url(#hs-rimHighlight)" opacity="0.4"/>
    <circle cx="300" cy="300" r="248" fill="url(#hs-brassMetal)" filter="url(#hs-grain)" opacity="0.3"/>

    <!-- Outer ring edge highlights -->
    <circle cx="300" cy="300" r="246" fill="none" stroke="#f5e6a3" stroke-width="0.5" opacity="0.5"/>
    <circle cx="300" cy="300" r="248" fill="none" stroke="#3a2f10" stroke-width="1.5"/>
    <circle cx="300" cy="300" r="250" fill="none" stroke="#5c4a1a" stroke-width="0.5" opacity="0.6"/>

    <!-- Inner bezel cut -->
    <circle cx="300" cy="300" r="225" fill="none" stroke="#3a2f10" stroke-width="2"/>
    <circle cx="300" cy="300" r="223" fill="none" stroke="#f5e6a3" stroke-width="0.5" opacity="0.35"/>

    <!-- Knurled edge dots (72 nubs, every 5 degrees) -->
    <circle cx="536" cy="300" r="2.2" fill="#d4b564" opacity="0.7"/>
    <circle cx="535.09" cy="320.58" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="532.38" cy="341.03" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="527.89" cy="361.22" r="2.2" fill="#d4b564" opacity="0.4"/>
    <circle cx="521.65" cy="381.02" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="513.72" cy="400.3" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="504.14" cy="418.94" r="2.2" fill="#d4b564" opacity="0.7"/>
    <circle cx="492.99" cy="436.82" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="480.35" cy="453.82" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="466.29" cy="469.83" r="2.2" fill="#d4b564" opacity="0.4"/>
    <circle cx="450.93" cy="484.74" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="434.36" cy="498.44" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="416.7" cy="510.84" r="2.2" fill="#d4b564" opacity="0.7"/>
    <circle cx="398.07" cy="521.86" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="378.59" cy="531.41" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="358.41" cy="539.44" r="2.2" fill="#d4b564" opacity="0.4"/>
    <circle cx="337.65" cy="545.89" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="316.46" cy="550.72" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="295" cy="553.92" r="2.2" fill="#d4b564" opacity="0.7"/>
    <circle cx="273.42" cy="555.46" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="251.88" cy="555.34" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="230.53" cy="553.56" r="2.2" fill="#d4b564" opacity="0.4"/>
    <circle cx="209.52" cy="550.13" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="189.01" cy="545.1" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="169.14" cy="538.51" r="2.2" fill="#d4b564" opacity="0.7"/>
    <circle cx="150.06" cy="530.4" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="131.9" cy="520.86" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="114.79" cy="509.95" r="2.2" fill="#d4b564" opacity="0.4"/>
    <circle cx="98.85" cy="497.76" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="84.19" cy="484.38" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="70.91" cy="469.93" r="2.2" fill="#d4b564" opacity="0.7"/>
    <circle cx="59.1" cy="454.51" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="48.83" cy="438.25" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="40.17" cy="421.26" r="2.2" fill="#d4b564" opacity="0.4"/>
    <circle cx="33.15" cy="403.68" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="27.82" cy="385.65" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="24.19" cy="367.3" r="2.2" fill="#d4b564" opacity="0.7"/>
    <circle cx="22.27" cy="348.77" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="22.06" cy="330.2" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="23.56" cy="311.72" r="2.2" fill="#d4b564" opacity="0.4"/>
    <circle cx="26.74" cy="293.47" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="31.57" cy="275.58" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="38.01" cy="258.18" r="2.2" fill="#d4b564" opacity="0.7"/>
    <circle cx="45.98" cy="241.39" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="55.41" cy="225.33" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="66.21" cy="210.12" r="2.2" fill="#d4b564" opacity="0.4"/>
    <circle cx="78.27" cy="195.85" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="91.48" cy="182.63" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="105.71" cy="170.53" r="2.2" fill="#d4b564" opacity="0.7"/>
    <circle cx="120.83" cy="159.64" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="136.7" cy="150.02" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="153.18" cy="141.73" r="2.2" fill="#d4b564" opacity="0.4"/>
    <circle cx="170.12" cy="134.81" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="187.36" cy="129.28" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="204.76" cy="125.17" r="2.2" fill="#d4b564" opacity="0.7"/>
    <circle cx="222.16" cy="122.49" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="239.39" cy="121.23" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="256.32" cy="121.4" r="2.2" fill="#d4b564" opacity="0.4"/>
    <circle cx="272.78" cy="122.98" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="288.63" cy="125.96" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="303.73" cy="130.28" r="2.2" fill="#d4b564" opacity="0.7"/>
    <circle cx="317.96" cy="135.91" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="331.17" cy="142.79" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="343.24" cy="150.83" r="2.2" fill="#d4b564" opacity="0.4"/>
    <circle cx="354.06" cy="159.97" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="363.52" cy="170.11" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="371.51" cy="181.15" r="2.2" fill="#d4b564" opacity="0.7"/>
    <circle cx="377.96" cy="192.98" r="1.4" fill="#a08030" opacity="0.4"/>
    <circle cx="382.79" cy="205.48" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="385.95" cy="218.52" r="2.2" fill="#d4b564" opacity="0.4"/>
    <circle cx="387.42" cy="231.97" r="1.4" fill="#a08030" opacity="0.7"/>
    <circle cx="387.17" cy="245.68" r="1.4" fill="#a08030" opacity="0.4"/>

    <!-- INNER FIELD (dark recessed area) -->
    <circle cx="300" cy="300" r="218" fill="url(#hs-innerField)"/>
    <circle cx="300" cy="300" r="218" fill="url(#hs-innerField)" filter="url(#hs-innerShadow)"/>

    <!-- Subtle ring texture inside -->
    <circle cx="300" cy="300" r="210" fill="none" stroke="#c5a049" stroke-width="0.3" opacity="0.15"/>
    <circle cx="300" cy="300" r="200" fill="none" stroke="#c5a049" stroke-width="0.3" opacity="0.1"/>
    <circle cx="300" cy="300" r="190" fill="none" stroke="#c5a049" stroke-width="0.2" opacity="0.08"/>

    <!-- CIRCULAR TEXT -->
    <text fill="#c5a049" font-size="18" letter-spacing="10" font-weight="bold" opacity="0.85">
      <textPath href="#hs-topTextPath" startOffset="50%" text-anchor="middle">BOOKY BLINDERS</textPath>
    </text>
    <text fill="#8a7030" font-size="13" letter-spacing="8" opacity="0.7">
      <textPath href="#hs-bottomTextPath" startOffset="50%" text-anchor="middle">EST. 1920</textPath>
    </text>

    <!-- Decorative dot clusters -->
    <circle cx="130" cy="270" r="2" fill="#c5a049" opacity="0.5"/>
    <circle cx="124" cy="278" r="1.3" fill="#a08030" opacity="0.4"/>
    <circle cx="120" cy="286" r="2" fill="#c5a049" opacity="0.5"/>
    <circle cx="470" cy="270" r="2" fill="#c5a049" opacity="0.5"/>
    <circle cx="476" cy="278" r="1.3" fill="#a08030" opacity="0.4"/>
    <circle cx="480" cy="286" r="2" fill="#c5a049" opacity="0.5"/>
    <circle cx="130" cy="330" r="2" fill="#c5a049" opacity="0.5"/>
    <circle cx="124" cy="322" r="1.3" fill="#a08030" opacity="0.4"/>
    <circle cx="120" cy="314" r="2" fill="#c5a049" opacity="0.5"/>
    <circle cx="470" cy="330" r="2" fill="#c5a049" opacity="0.5"/>
    <circle cx="476" cy="322" r="1.3" fill="#a08030" opacity="0.4"/>
    <circle cx="480" cy="314" r="2" fill="#c5a049" opacity="0.5"/>

    <!-- CENTER BB MONOGRAM (ETCO Brookshire font) -->
    <g filter="url(#hs-letterEmboss)">
      <!-- Shadow / depth layer -->
      <text x="300" y="320" text-anchor="middle" font-family="'ETCO Brookshire', serif" font-size="160" letter-spacing="12" fill="#000" opacity="0.3" transform="translate(3, 4)">BB</text>

      <!-- Main BB with brass gradient -->
      <text x="300" y="320" text-anchor="middle" font-family="'ETCO Brookshire', serif" font-size="160" letter-spacing="12" fill="url(#hs-letterGrad)" stroke="#3a2f10" stroke-width="1">BB</text>

      <!-- Polished highlight layer -->
      <text x="300" y="320" text-anchor="middle" font-family="'ETCO Brookshire', serif" font-size="160" letter-spacing="12" fill="url(#hs-letterFace)" opacity="0.4">BB</text>

      <!-- Top edge highlight stroke -->
      <text x="300" y="320" text-anchor="middle" font-family="'ETCO Brookshire', serif" font-size="160" letter-spacing="12" fill="none" stroke="#f5e6a3" stroke-width="0.8" opacity="0.25">BB</text>
    </g>

    <!-- CROSSED ELEMENTS behind BB -->
    <g opacity="0.18">
      <line x1="210" y1="370" x2="390" y2="220" stroke="#c5a049" stroke-width="1.5"/>
      <line x1="210" y1="220" x2="390" y2="370" stroke="#c5a049" stroke-width="1.5"/>
      <polygon points="300,290 306,295 300,300 294,295" fill="#c5a049" opacity="0.5"/>
    </g>

    <!-- INNER DECORATIVE RING -->
    <circle cx="300" cy="300" r="160" fill="none" stroke="url(#hs-edgeLight)" stroke-width="1.5" opacity="0.4"/>
    <circle cx="300" cy="300" r="156" fill="none" stroke="#3a2f10" stroke-width="0.5" opacity="0.3"/>

    <!-- Decorative dots on inner ring (8 dots at 45deg intervals) -->
    <circle cx="458" cy="300" r="2.5" fill="#c5a049" opacity="0.5"/>
    <circle cx="411.72" cy="411.72" r="2.5" fill="#c5a049" opacity="0.5"/>
    <circle cx="300" cy="458" r="2.5" fill="#c5a049" opacity="0.5"/>
    <circle cx="188.28" cy="411.72" r="2.5" fill="#c5a049" opacity="0.5"/>
    <circle cx="142" cy="300" r="2.5" fill="#c5a049" opacity="0.5"/>
    <circle cx="188.28" cy="188.28" r="2.5" fill="#c5a049" opacity="0.5"/>
    <circle cx="300" cy="142" r="2.5" fill="#c5a049" opacity="0.5"/>
    <circle cx="411.72" cy="188.28" r="2.5" fill="#c5a049" opacity="0.5"/>

    <!-- SHIMMER OVERLAY -->
    <g clip-path="url(#hs-sealClip)">
      <rect x="-300" y="-300" width="1200" height="1200" fill="url(#hs-shimmer)" opacity="0.5">
        <animateTransform attributeName="transform" type="translate" from="-600 -600" to="600 600" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
