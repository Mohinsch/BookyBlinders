# ================================================================
# Docker Compose for Booky Blinders Development
# Stack: PostgreSQL, Adminer, Next.js (Hot-reload)
# ================================================================

services:
  # PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: booky_db
    # Only restart if the container crashes, but remain off if manually stopped
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # Persist database data across container restarts
      - postgres_data:/var/lib/postgresql/data
    
    # Ensure DB is fully ready before starting dependent services to avoid connection crashes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Database Management GUI (Graphical User Interface)
  adminer:
    image: adminer
    container_name: booky_adminer
    restart: unless-stopped
    # Access at http://localhost:8080 (Login with DB credentials from .env)
    ports:
      - "8080:8080"
    depends_on:
      db:
        # Wait for the database healthcheck to pass before starting Adminer
        condition: service_healthy

  # Next.js Application Service
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: booky_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXT_PUBLIC_API_URL: http://localhost:3000
    volumes:
      # Mount source code for Next.js hot-reloading
      - .:/app
      # Isolate container's node_modules from the host to avoid OS binary conflicts
      - /app/node_modules
    depends_on:
      db:
        # Prevent Next.js connection crashes by waiting for the DB to be fully ready
        condition: service_healthy

volumes:
  postgres_data: